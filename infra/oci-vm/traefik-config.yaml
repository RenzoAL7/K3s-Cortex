# Entrada del LB OCI hacia la VM privada: TCP/80. Chart Traefik 40.x.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        type: ClusterIP
    providers:
      kubernetesIngress:
        publishedService:
          enabled: false
        ingressEndpoint:
          ip: 193.122.221.201
    ports:
      web:
        hostPort: 80
        forwardedHeaders:
          trustedIPs:
            - 10.0.0.0/24
    updateStrategy:
      type: Recreate
