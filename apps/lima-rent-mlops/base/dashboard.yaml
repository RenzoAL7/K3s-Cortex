apiVersion: v1
kind: Service
metadata:
  name: lima-rent-dashboard
spec:
  selector: {app: lima-rent-dashboard}
  ports:
    - {name: http, port: 8501}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lima-rent-dashboard
spec:
  # Una réplica: Streamlit mantiene la sesión de cada visitante en memoria.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: lima-rent-dashboard}
  template:
    metadata:
      labels: {app: lima-rent-dashboard}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: dashboard
          image: ghcr.io/renzoal7/lima-rent-dashboard:local
          ports:
            - {containerPort: 8501, name: http}
          envFrom:
            - configMapRef: {name: lima-rent-config}
            - secretRef: {name: lima-rent-s3}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe:
            httpGet: {path: /_stcore/health, port: 8501}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /_stcore/health, port: 8501}
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 768Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
---
# Dominio propio detrás de Cloudflare, igual que peru-spend-tracker: Cloudflare termina HTTPS,
# el balanceador de OCI reenvía el puerto 80 y Traefik enruta por host.
#   /api/*  -> API (FastAPI)
#   /*      -> dashboard (Streamlit)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lima-rent
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.priority: "20"
spec:
  ingressClassName: traefik
  rules:
    - host: lima-rent.renzoaguilar.dev
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: lima-rent-api
                port: {name: http}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lima-rent-dashboard
                port: {name: http}
