apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../estado
# Pone "portafolio" solo a los recursos sin namespace: los RoleBinding de
# estado/rbac.yaml viven en el namespace de cada proyecto y deben quedarse ahí.
transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: namespace-portafolio
      namespace: portafolio
    unsetOnly: true
# El workflow de RenzoAL7/portafolio reemplaza estos digests en cada push a main.
images:
  - name: ghcr.io/renzoal7/portafolio
    digest: sha256:8e923ee717facd40aa39bf6221d710da6a6ea4157904427bdbc022c3e927fef3
  - name: ghcr.io/renzoal7/portafolio-estado
    digest: sha256:be330f55ed3704f3196af90a18cc3e2af87ca72f6bc525acf8344a37c5616e53
