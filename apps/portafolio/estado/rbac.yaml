---
# Datos de la VM: capacidad, condiciones y uso de CPU/RAM de los nodos.
# Sin nodes/proxy (daría acceso al kubelet) ni escritura.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: portafolio-estado-nodos
  labels:
    app.kubernetes.io/name: portafolio-estado
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portafolio-estado-nodos
  labels:
    app.kubernetes.io/name: portafolio-estado
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: portafolio-estado-nodos
subjects:
  - kind: ServiceAccount
    name: portafolio-estado
    namespace: portafolio
