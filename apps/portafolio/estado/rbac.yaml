metadata:
  name: portafolio-estado-lectura
  namespace: gpath
  labels:
    app.kubernetes.io/name: portafolio-estado
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: portafolio-estado-lectura
subjects:
  - kind: ServiceAccount
    name: portafolio-estado
    namespace: portafolio
---
apiVersion: rbac.authorization.k8s.io/v1
