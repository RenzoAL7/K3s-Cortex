# Permisos del panel privado, solo en los namespaces enlazados abajo:
# listar y seguir (watch) workloads y pods, leer métricas y logs.
# Sin secrets, configmaps, exec, port-forward ni escritura.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: portafolio-estado-lectura
  labels:
    app.kubernetes.io/name: portafolio-estado
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portafolio-estado-lectura
  namespace: portafolio
  labels:
    app.kubernetes.io/name: portafolio-estado
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: portafolio-estado-lectura
subjects:
  - kind: ServiceAccount
    name: portafolio-estado
    namespace: portafolio
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portafolio-estado-lectura
  namespace: brinke
  labels:
    app.kubernetes.io/name: portafolio-estado
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: portafolio-estado-lectura
subjects:
  - kind: ServiceAccount
    name: portafolio-estado
    namespace: portafolio
---
