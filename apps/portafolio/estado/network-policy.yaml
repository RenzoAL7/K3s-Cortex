apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portafolio-estado-solo-traefik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: portafolio-estado
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
