# OCI HTTP health checks do not use the public Host header. Only this exact path
# is host-independent; the application still requires its configured hostname.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gpath-lb-health
  namespace: gpath
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: gpath
                port:
                  name: http
