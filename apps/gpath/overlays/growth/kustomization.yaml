# Growth Path: inactive until the promotion PR pins both real digests AND changes
# clusters/rnz-prod/gpath-application.yaml to this path. Do not apply as-is.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gpath
resources:
  - ../../base
  - ../../api
images:
  - name: ghcr.io/renzoal7/gitpath
    newName: ghcr.io/renzoal7/gitpath
    digest: sha256:7ceca04676499a48874452820f344b96e42bd0095cf0c8ace33a1c5487e59641
  - name: ghcr.io/renzoal7/gitpath-api
    newName: ghcr.io/renzoal7/gitpath-api
    digest: sha256:ad7a3c85d8fa2481a1b048d06e8670973e7fc7be3dbf4486ad75ce14d762c6f0
patches:
  - path: web-runtime.yaml
  - target:
      kind: Ingress
      name: gpath
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: gpath.tech
      - op: add
        path: /spec/rules/0/http/paths/0
        value:
          path: /api
          pathType: Prefix
          backend:
            service:
              name: gpath-api
              port:
                name: http
