# Growth Path: inactive until the promotion PR pins both real digests AND changes
# clusters/rnz-prod/gpath-application.yaml to this path. Do not apply as-is.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gpath
resources:
  - ../../base
  - ../../api
images:
  - name: ghcr.io/renzoal7/gitpath
    newName: ghcr.io/renzoal7/gitpath
    digest: sha256:117af45f97a124df0e1edf777998f3f47fb1835a55c7faccadaf6d49ddbe234b
  - name: ghcr.io/renzoal7/gitpath-api
    newName: ghcr.io/renzoal7/gitpath-api
    digest: sha256:0f1f4e1e7fc33c1133a7398ba44e24462f8dea01e566fa664b02f18c97d0dee9
patches:
  - path: web-runtime.yaml
  - target:
      kind: Ingress
      name: gpath
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: gpath.tech
      - op: add
        path: /spec/rules/0/http/paths/0
        value:
          path: /api
          pathType: Prefix
          backend:
            service:
              name: gpath-api
              port:
                name: http
