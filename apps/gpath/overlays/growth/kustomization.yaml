# Growth Path: inactive until the promotion PR pins both real digests AND changes
# clusters/rnz-prod/gpath-application.yaml to this path. Do not apply as-is.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gpath
resources:
  - ../../base
  - ../../api
images:
  - name: ghcr.io/renzoal7/gitpath
    newName: ghcr.io/renzoal7/gitpath
    digest: sha256:27ec90a5a01b2bcb47e493c134db26745f8ce54a0faa25520f95ce64fab76dbd
  - name: ghcr.io/renzoal7/gitpath-api
    newName: ghcr.io/renzoal7/gitpath-api
    digest: sha256:182bcaed4d13feb6ec70df988dae6888b6cd8014ed7571779e596d7512ea097b
patches:
  - path: web-runtime.yaml
  - target:
      kind: Ingress
      name: gpath
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: gpath.tech
      - op: add
        path: /spec/rules/0/http/paths/0
        value:
          path: /api
          pathType: Prefix
          backend:
            service:
              name: gpath-api
              port:
                name: http
