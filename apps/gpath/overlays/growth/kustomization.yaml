# Growth Path: active production overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gpath
resources:
  - ../../base
  - ../../api
  - brinke-application.yaml
images:
  - name: ghcr.io/renzoal7/gitpath
    newName: ghcr.io/renzoal7/gitpath
    digest: sha256:45d8587fa0c630d05743ccb3e27d4f6a712bc5c1cbfdddb5b13f824c0c361396
  - name: ghcr.io/renzoal7/gitpath-api
    newName: ghcr.io/renzoal7/gitpath-api
    digest: sha256:b468da75e778a8c0fdb4194c87af1e2a86d38c07f07ad690af86ec4c7669761d
patches:
  - path: web-runtime.yaml
  - target:
      kind: Ingress
      name: gpath
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: gpath.tech
      - op: add
        path: /spec/rules/0/http/paths/0
        value:
          path: /api
          pathType: Prefix
          backend:
            service:
              name: gpath-api
              port:
                name: http
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: brinke-prod
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: argocd
