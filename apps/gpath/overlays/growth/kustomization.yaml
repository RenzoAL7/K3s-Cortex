# Growth Path: inactive until the promotion PR pins both real digests AND changes
# clusters/rnz-prod/gpath-application.yaml to this path. Do not apply as-is.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gpath
resources:
  - ../../base
  - ../../api
images:
  - name: ghcr.io/renzoal7/gitpath
    newName: ghcr.io/renzoal7/gitpath
    digest: sha256:947a7930bda0cb1b6964057a4059ad03aafe00bb01675121fc7293e1b61efcdc
  - name: ghcr.io/renzoal7/gitpath-api
    newName: ghcr.io/renzoal7/gitpath-api
    digest: sha256:34de7a2b08def3bdd665a3440e4238833c3e00919deb7327cf15add1cabb3ab9
patches:
  - path: web-runtime.yaml
  - target:
      kind: Ingress
      name: gpath
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: gpath.tech
      - op: add
        path: /spec/rules/0/http/paths/0
        value:
          path: /api
          pathType: Prefix
          backend:
            service:
              name: gpath-api
              port:
                name: http
