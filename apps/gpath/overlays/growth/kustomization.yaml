# Growth Path: inactive until the promotion PR pins both real digests AND changes
# clusters/rnz-prod/gpath-application.yaml to this path. Do not apply as-is.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gpath
resources:
  - ../../base
  - ../../api
images:
  - name: ghcr.io/renzoal7/gitpath
    newName: ghcr.io/renzoal7/gitpath
    digest: sha256:3bce88e4716948c230097f15d4473606caf125d5b46d52fff30ac5381aa0ad53
  - name: ghcr.io/renzoal7/gitpath-api
    newName: ghcr.io/renzoal7/gitpath-api
    digest: sha256:284715c223d3a95e2b0e0234c42e6ddc31c12aba90a24d49b00336f15d32a091
patches:
  - path: web-runtime.yaml
  - target:
      kind: Ingress
      name: gpath
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: gpath.tech
      - op: add
        path: /spec/rules/0/http/paths/0
        value:
          path: /api
          pathType: Prefix
          backend:
            service:
              name: gpath-api
              port:
                name: http
