apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: brinke-prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: brinke
    app.kubernetes.io/managed-by: gpath-prod
  annotations:
    # Evita que gpath-prod borre Brinke al retirar esta copia del overlay.
    # Argo lee la opción del objeto vivo: debe estar sincronizada antes de retirarla.
    argocd.argoproj.io/sync-options: Prune=false
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/RenzoAL7/K3s-Cortex.git
    targetRevision: main
    path: apps/brinke/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: brinke
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
