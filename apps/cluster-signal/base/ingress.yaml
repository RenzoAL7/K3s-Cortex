apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cluster-signal-strip
  labels:
    app.kubernetes.io/name: cluster-signal
spec:
  stripPrefix:
    prefixes:
      - /cluster-signal
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cluster-signal
  labels:
    app.kubernetes.io/name: cluster-signal
    app.kubernetes.io/component: web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: cluster-signal-cluster-signal-strip@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /cluster-signal/api
            pathType: Prefix
            backend:
              service:
                name: cluster-signal-api
                port:
                  name: http
          - path: /cluster-signal/health
            pathType: Prefix
            backend:
              service:
                name: cluster-signal-api
                port:
                  name: http
          - path: /cluster-signal/ready
            pathType: Prefix
            backend:
              service:
                name: cluster-signal-api
                port:
                  name: http
          - path: /cluster-signal
            pathType: Prefix
            backend:
              service:
                name: cluster-signal-web
                port:
                  name: http
