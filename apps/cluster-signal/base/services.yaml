apiVersion: v1
kind: Service
metadata:
  name: cluster-signal-api
  labels:
    app.kubernetes.io/name: cluster-signal
    app.kubernetes.io/component: api
  annotations:
    traefik.ingress.kubernetes.io/service.nativelb: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cluster-signal
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: cluster-signal-web
  labels:
    app.kubernetes.io/name: cluster-signal
    app.kubernetes.io/component: web
  annotations:
    traefik.ingress.kubernetes.io/service.nativelb: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cluster-signal
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
