apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-signal-observer
  labels:
    app.kubernetes.io/name: cluster-signal
rules:
  - apiGroups:
      - ""
    resources:
      - events
      - namespaces
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - metrics.k8s.io
    resources:
      - pods
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-signal-observer
  labels:
    app.kubernetes.io/name: cluster-signal
subjects:
  - kind: ServiceAccount
    name: cluster-signal-api
    namespace: cluster-signal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-signal-observer
