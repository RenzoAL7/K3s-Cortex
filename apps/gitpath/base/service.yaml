apiVersion: v1
kind: Service
metadata:
  name: gitpath
  labels:
    app.kubernetes.io/name: gitpath
    app.kubernetes.io/component: web
  annotations:
    # Route through the Kubernetes ClusterIP instead of connecting directly
    # to individual Pod IPs. This avoids the current Traefik-to-Pod 502 path.
    traefik.ingress.kubernetes.io/service.nativelb: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gitpath
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
