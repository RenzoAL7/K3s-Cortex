apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitpath
  labels:
    app.kubernetes.io/name: gitpath
    app.kubernetes.io/component: web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitpath
                port:
                  name: http
