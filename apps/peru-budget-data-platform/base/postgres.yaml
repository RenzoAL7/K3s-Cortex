apiVersion: v1
kind: Service
metadata:
  name: airflow-postgres
spec:
  clusterIP: None
  selector: {app: airflow-postgres}
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: airflow-postgres
spec:
  serviceName: airflow-postgres
  replicas: 1
  selector:
    matchLabels: {app: airflow-postgres}
  template:
    metadata:
      labels: {app: airflow-postgres}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17.6-alpine
          ports:
            - containerPort: 5432
          env:
            - {name: POSTGRES_USER, value: airflow}
            - {name: POSTGRES_DB, value: airflow}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: airflow-secrets, key: postgres-password}
          readinessProbe:
            exec:
              command: [pg_isready, -U, airflow]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
