apiVersion: v1
kind: Service
metadata:
  name: gasto-site
spec:
  selector: {app: gasto-site}
  ports:
    - {name: http, port: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gasto-site
spec:
  # Dos replicas: si un pod se reinicia, el otro sigue atendiendo.
  replicas: 2
  # El pod nuevo arranca antes de retirar el viejo: el sitio no se corta al desplegar.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: gasto-site}
  template:
    metadata:
      labels: {app: gasto-site}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 101, fsGroup: 101, seccompProfile: {type: RuntimeDefault}, seLinuxOptions: {level: "s0:c500,c501"}}
      containers:
        - name: nginx
          image: ghcr.io/renzoal7/gasto-site:local
          ports:
            - {containerPort: 8080, name: http}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 2
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: data, mountPath: /data, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: data
          persistentVolumeClaim: {claimName: gasto-data, readOnly: true}
---
# Dominio propio detras de Cloudflare. El balanceador de OCI solo reenvia el puerto 80,
# asi que Cloudflare termina HTTPS y llega por HTTP (modo SSL "Flexible").
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gasto-site-dominio
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.priority: "20"
spec:
  ingressClassName: traefik
  rules:
    - host: peru-spend-tracker.renzoaguilar.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gasto-site
                port: {name: http}
