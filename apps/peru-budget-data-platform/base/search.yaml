apiVersion: v1
kind: Service
metadata:
  name: gasto-search
spec:
  selector: {app: gasto-search}
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gasto-search
spec:
  replicas: 1
  # El pod nuevo arranca antes de retirar el viejo: la busqueda no se corta al desplegar.
  # Ambos leen el volumen en modo lectura en el mismo nodo; la cuota deja margen para los dos.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: gasto-search}
  template:
    metadata:
      labels: {app: gasto-search}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}, seLinuxOptions: {level: "s0:c500,c501"}}
      initContainers:
        - name: pull-model
          image: ghcr.io/renzoal7/gasto-search:local
          command: [gasto, pull-model]
          envFrom: &env
            - configMapRef: {name: gasto-config}
            - secretRef: {name: gasto-secrets, optional: true}
          securityContext: &sc {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /models, subPath: models}
      containers:
        - name: api
          image: ghcr.io/renzoal7/gasto-search:local
          ports:
            - containerPort: 8080
          env:
            - {name: INDEX_PATH, value: /data/gold/search/index.npz}
            - {name: DUCKDB_THREADS, value: "2"}
            - {name: FASTEMBED_CACHE_PATH, value: /models}
            - {name: MODEL_OFFLINE, value: "1"}
            - name: SEARCH_TOKEN
              valueFrom:
                secretKeyRef: {name: gasto-secrets, key: SEARCH_TOKEN, optional: true}
          securityContext: *sc
          # /readyz carga el modelo y el indice en la primera llamada. La sonda de arranque
          # revisa cada 2 s (hasta 2 min) y marca el pod listo en cuanto termina de cargar.
          startupProbe:
            httpGet: {path: /readyz, port: 8080}
            periodSeconds: 2
            timeoutSeconds: 30
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
            periodSeconds: 20
            timeoutSeconds: 30
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 700Mi}
            limits: {memory: 1500Mi}
          volumeMounts:
            - {name: data, mountPath: /models, subPath: models, readOnly: true}
            - {name: data, mountPath: /data, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
        - name: data
          persistentVolumeClaim: {claimName: gasto-data}
