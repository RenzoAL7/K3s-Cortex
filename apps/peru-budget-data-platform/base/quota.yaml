apiVersion: v1
kind: ResourceQuota
metadata:
  name: gasto-publico
spec:
  hard:
    # Margen para que un despliegue (pods nuevos antes de retirar los viejos) coincida con
    # un pod del pipeline sin que la cuota lo bloquee. Lo reservado se controla con requests.
    limits.memory: 16Gi
    requests.memory: 5Gi
