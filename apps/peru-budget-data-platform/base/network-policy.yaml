apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-solo-airflow
spec:
  podSelector:
    matchLabels: {app: airflow-postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [airflow-api, airflow-scheduler]}
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: airflow-api-interno
spec:
  podSelector:
    matchLabels: {app: airflow-api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: airflow-scheduler}
      ports:
        - port: 8080
