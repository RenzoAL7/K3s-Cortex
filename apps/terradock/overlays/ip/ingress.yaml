apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: terradock-public-ip
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    # Host-specific routes and the existing exact /healthz route take precedence.
    traefik.ingress.kubernetes.io/router.priority: '1'
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: terradock-public
                port:
                  name: http
