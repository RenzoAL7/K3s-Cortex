# Relative asset and page links only resolve under /brinke/ with the final slash.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: brinke-add-slash
  labels:
    app.kubernetes.io/name: brinke
spec:
  redirectRegex:
    regex: ^(https?://[^/?]+/brinke)(\?.*)?$
    replacement: ${1}/${2}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: brinke-strip
  labels:
    app.kubernetes.io/name: brinke
spec:
  stripPrefix:
    prefixes:
      - /brinke
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: brinke
  labels:
    app.kubernetes.io/name: brinke
    app.kubernetes.io/component: web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: brinke-brinke-add-slash@kubernetescrd,brinke-brinke-strip@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /brinke
            pathType: Prefix
            backend:
              service:
                name: brinke
                port:
                  name: http
---
# La IP del balanceador solo sirve Brinke: la raiz manda a /brinke/.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: brinke-root
  labels:
    app.kubernetes.io/name: brinke
spec:
  redirectRegex:
    regex: ^(https?://[^/?]+)/?(\?.*)?$
    replacement: ${1}/brinke/${2}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: brinke-root
  labels:
    app.kubernetes.io/name: brinke
    app.kubernetes.io/component: web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: brinke-brinke-root@kubernetescrd
    # Las rutas con host propio (dominios) van por encima.
    traefik.ingress.kubernetes.io/router.priority: "1"
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: brinke
                port:
                  name: http
