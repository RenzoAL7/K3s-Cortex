apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: brinke-strip
  labels:
    app.kubernetes.io/name: brinke
spec:
  stripPrefix:
    prefixes:
      - /brinke
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: brinke
  labels:
    app.kubernetes.io/name: brinke
    app.kubernetes.io/component: web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: brinke-brinke-strip@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /brinke
            pathType: Prefix
            backend:
              service:
                name: brinke
                port:
                  name: http
