# brinke.renzoaguilar.dev: Cloudflare termina HTTPS y llega por el puerto 80.
# La herramienta de talleres se sirve en la raíz; nginx redirige /talleres.html a /.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: brinke-dominio
  labels:
    app.kubernetes.io/name: brinke
    app.kubernetes.io/component: web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.priority: '20'
spec:
  ingressClassName: traefik
  rules:
    - host: brinke.renzoaguilar.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: brinke
                port:
                  name: http
