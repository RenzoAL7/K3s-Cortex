# brinke.renzoaguilar.dev: Cloudflare termina HTTPS y llega por el puerto 80.
# Sirve la herramienta de talleres en un origen HTTPS, requisito del inicio de sesión con Google.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: brinke-talleres-root
  labels:
    app.kubernetes.io/name: brinke
spec:
  redirectRegex:
    regex: ^https?://brinke\.renzoaguilar\.dev/?(\?.*)?$
    replacement: https://brinke.renzoaguilar.dev/talleres.html${1}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: brinke-dominio
  labels:
    app.kubernetes.io/name: brinke
    app.kubernetes.io/component: web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.priority: '20'
    traefik.ingress.kubernetes.io/router.middlewares: brinke-brinke-talleres-root@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: brinke.renzoaguilar.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: brinke
                port:
                  name: http
