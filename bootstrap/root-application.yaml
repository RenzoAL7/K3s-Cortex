apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cortex-root
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: k3s-cortex
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/RenzoAL7/K3s-Cortex.git
    targetRevision: main
    path: clusters/rnz-prod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
